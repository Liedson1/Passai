name: passai
description: "Consulta de horários de vans intermunicipais no Sertão de Alagoas"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Design
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Backend / BaaS
  supabase_flutter: ^2.8.4

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navegação
  go_router: ^14.8.1

  # Modelos imutáveis e serialização
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Variáveis de ambiente
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
