  <!-- Vercel Web Analytics & Speed Insights (carregamento assíncrono em idle para não competir com a main thread) -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    function carregarVercelInsights() {
      var s1 = document.createElement('script');
      s1.src = '/_vercel/insights/script.js';
      s1.async = true;
      document.head.appendChild(s1);

      var s2 = document.createElement('script');
      s2.src = '/_vercel/speed-insights/script.js';
      s2.async = true;
      document.head.appendChild(s2);
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(carregarVercelInsights, { timeout: 3000 });
    } else {
      setTimeout(carregarVercelInsights, 2000);
    }
  </script>

<body>
  <script>
    // ============================================================
    // Passaí PWA Controller & Native Install Interop
    // ============================================================
    window.passaiPwa = {
      deferredPrompt: null,
      isInstalled: false,
      canInstall: false,

      promptInstall: function() {
        if (!this.deferredPrompt) {
          return Promise.resolve(false);
        }
        var promptEvent = this.deferredPrompt;
        this.deferredPrompt = null;
        this.canInstall = false;
        this._notifyState();

        return promptEvent.prompt().then(function() {
          return promptEvent.userChoice;
        }).then(function(choice) {
          return choice && choice.outcome === 'accepted';
        }).catch(function() {
          return false;
        });
      },

      checkIsStandalone: function() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
               (window.navigator && window.navigator.standalone === true) ||
               (document.referrer && document.referrer.includes('android-app://'));
      },

      checkIsIos: function() {
        var ua = window.navigator.userAgent.toLowerCase();
        return /iphone|ipad|ipod/.test(ua);
      },

      _notifyState: function() {
        window.dispatchEvent(new CustomEvent('passai-pwa-update', {
          detail: {
            canInstall: this.canInstall,
            isInstalled: this.isInstalled,
            isStandalone: this.checkIsStandalone(),
            isIos: this.checkIsIos()
          }
        }));
      }
    };

    window.passaiPwa.isInstalled = window.passaiPwa.checkIsStandalone();

    // Captura o evento nativo beforeinstallprompt
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.passaiPwa.deferredPrompt = e;
      window.passaiPwa.canInstall = true;
      window.passaiPwa._notifyState();
    });

    // Detecta instalação concluída
    window.addEventListener('appinstalled', function() {
      window.passaiPwa.deferredPrompt = null;
      window.passaiPwa.canInstall = false;
      window.passaiPwa.isInstalled = true;
      window.passaiPwa._notifyState();
    });

    // Registra o Service Worker oficial do Passaí PWA com ciclo de vida seguro
    if ('serviceWorker' in navigator) {
      // Guarda se a página já estava sendo controlada por um service worker anterior
      var hadPreviousController = Boolean(navigator.serviceWorker.controller);
      var isReloading = false;

      navigator.serviceWorker.addEventListener('controllerchange', function() {
        // Só recarrega se já havia um controlador anterior (atualização real de versão)
        if (hadPreviousController && !isReloading) {
          isReloading = true;
          console.log('[Passaí PWA] Nova versão ativa. Atualizando página...');
          window.location.reload();
        }
      });

      function registrarSW() {
        navigator.serviceWorker.register("sw.js?v=1.0.20260930121500", { scope: "./" })
          .then(function(reg) {
            console.log('[Passaí PWA] Service Worker registrado:', reg.scope);
            setTimeout(function() {
              reg.update();
            }, 5000);
            document.addEventListener('visibilitychange', function() {
              if (document.visibilityState === 'visible') {
                reg.update();
              }
            });
          })
          .catch(function(err) {
            console.warn('[Passaí PWA] Falha no registro do Service Worker:', err);
          });
      }

      // Registra o Service Worker após o primeiro frame ou em idle para liberar 100% de CPU inicial para o Flutter
      if ('requestIdleCallback' in window) {
        requestIdleCallback(registrarSW, { timeout: 4000 });
      } else {
        setTimeout(registrarSW, 2500);
      }
    }

    // ============================================================
    // Suporte ao Back/Forward Cache (bfcache) do Navegador
    // ============================================================
    window.addEventListener('pageshow', function(event) {
      // bfcache restoration
    });
  </script>
  <script src="flutter_bootstrap.js?v=1.0.20260930121500" async></script>
</body>
