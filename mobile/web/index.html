<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="description" content="Consulte horários atualizados de vans de transporte intermunicipal em Alagoas em tempo real. Sem login, sem cadastro, direto ao ponto.">
  <meta name="keywords" content="van, vans, transporte intermunicipal, alagoas, maceió, arapiraca, palmeira dos índios, piranhas, delmiro gouveia, horários de vans">

  <!-- OpenGraph / Redes Sociais / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Passaí — Horários de Vans em Alagoas">
  <meta property="og:description" content="Consulte horários de vans intermunicipais em Alagoas em tempo real. Sem login, rápido e direto ao ponto.">
  <meta property="og:site_name" content="Passaí">
  <meta property="og:image" content="og_image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="theme-color" content="#D95438">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Passaí">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts: Preconnect Jua (Fonte oficial da logo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <title>Passaí — Horários de Vans em Alagoas</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Estilo do Splash Screen Nativo para prevenir tela branca */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F9F6F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    #splash-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #F9F6F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 99999;
      transition: opacity 0.35s ease-out;
      animation: fadeIn 0.4s ease-out;
    }
    .splash-logo {
      width: 68px;
      height: 68px;
      background: #D95438;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(217, 84, 56, 0.28);
      margin-bottom: 16px;
    }
    .splash-logo svg {
      width: 38px;
      height: 38px;
      fill: #FFFFFF;
    }
    .splash-title {
      font-family: 'Jua', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 28px;
      font-weight: 400;
      color: #D95438;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .splash-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #8F7D77;
      margin-bottom: 24px;
    }
    .splash-bar {
      width: 120px;
      height: 4px;
      background: rgba(217, 84, 56, 0.15);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .splash-progress {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background: #D95438;
      border-radius: 4px;
      animation: pulseBar 1.2s infinite ease-in-out;
    }
    @keyframes pulseBar {
      0% { left: -40%; width: 30%; }
      50% { left: 40%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <!-- Splash Screen visível enquanto o engine do Flutter é carregado -->
  <div id="splash-loading">
    <div class="splash-logo" style="background: none; box-shadow: none; width: 84px; height: 84px;">
      <img src="icons/Icon-192.png" alt="Passaí Logo" style="width: 84px; height: 84px; border-radius: 50%; box-shadow: 0 10px 25px rgba(217, 84, 56, 0.35);">
    </div>
    <div class="splash-title">Passaí</div>
    <div class="splash-subtitle">Horários de Vans • Alagoas</div>
    <div class="splash-bar">
      <div class="splash-progress"></div>
    </div>
  </div>

  <script>
    function removeSplashScreen() {
      var splash = document.getElementById('splash-loading');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 380);
      }
    }

    // Disparado pelo Flutter quando o primeiro frame renderiza
    window.addEventListener('flutter-first-frame', function () {
      removeSplashScreen();
    });

    // Fallback de segurança (caso o evento não dispare por algum motivo)
    window.addEventListener('load', function () {
      setTimeout(function () {
        removeSplashScreen();
      }, 3500);
    });

    // ============================================================
    // Passaí PWA Controller & Native Install Interop
    // ============================================================
    window.passaiPwa = {
      deferredPrompt: null,
      isInstalled: false,
      canInstall: false,

      promptInstall: function() {
        if (!this.deferredPrompt) {
          return Promise.resolve(false);
        }
        var promptEvent = this.deferredPrompt;
        this.deferredPrompt = null;
        this.canInstall = false;
        this._notifyState();

        return promptEvent.prompt().then(function() {
          return promptEvent.userChoice;
        }).then(function(choice) {
          return choice && choice.outcome === 'accepted';
        }).catch(function() {
          return false;
        });
      },

      checkIsStandalone: function() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
               (window.navigator && window.navigator.standalone === true) ||
               (document.referrer && document.referrer.includes('android-app://'));
      },

      checkIsIos: function() {
        var ua = window.navigator.userAgent.toLowerCase();
        return /iphone|ipad|ipod/.test(ua);
      },

      _notifyState: function() {
        window.dispatchEvent(new CustomEvent('passai-pwa-update', {
          detail: {
            canInstall: this.canInstall,
            isInstalled: this.isInstalled,
            isStandalone: this.checkIsStandalone(),
            isIos: this.checkIsIos()
          }
        }));
      }
    };

    window.passaiPwa.isInstalled = window.passaiPwa.checkIsStandalone();

    // Captura o evento nativo beforeinstallprompt
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.passaiPwa.deferredPrompt = e;
      window.passaiPwa.canInstall = true;
      window.passaiPwa._notifyState();
    });

    // Detecta instalação concluída
    window.addEventListener('appinstalled', function() {
      window.passaiPwa.deferredPrompt = null;
      window.passaiPwa.canInstall = false;
      window.passaiPwa.isInstalled = true;
      window.passaiPwa._notifyState();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
