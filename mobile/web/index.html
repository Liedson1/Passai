  <style>
    /* Estilo do Splash Screen Nativo com aceleração por GPU (Zero Lag) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #F9F6F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      touch-action: pan-y manipulation;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }
    flt-glass-pane {
      touch-action: pan-y manipulation !important;
    }
    /* A splash HTML replica exatamente o design da splash nativa do Android/iOS (ícone da van centralizado em #F9F6F0),
       garantindo continuidade visual perfeita entre o fechamento da splash nativa e a renderização do Flutter,
       sem nunca exibir tela em branco nem elementos extras de texto/barra. */
    #splash-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #F9F6F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 99999;
      transform: translateZ(0);
      will-change: opacity;
      transition: opacity 0.24s cubic-bezier(0.25, 1, 0.5, 1);
      contain: strict;
      pointer-events: none;
    }
    .splash-logo {
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-logo img {
      width: 84px;
      height: 84px;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <!-- Splash Screen com o mesmo ícone da van para transição 100% contínua e sem tela em branco -->
  <div id="splash-loading">
    <div class="splash-logo">
      <img src="icons/Icon-192.png" alt="Passaí" width="84" height="84" fetchpriority="high" loading="eager">
    </div>
  </div>

  <script>
    var splashRemoved = false;
    window.removeSplashScreen = function() {
      if (splashRemoved) return;
      splashRemoved = true;
      var splash = document.getElementById('splash-loading');
      if (splash) {
        requestAnimationFrame(function() {
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 260);
        });
      }
    };

    // Disparado pelo Flutter quando o primeiro frame renderiza
    window.addEventListener('flutter-first-frame', function () {
      window.removeSplashScreen();
    });

    // Fallback de segurança (caso o evento demore)
    window.addEventListener('load', function () {
      setTimeout(function () {
        window.removeSplashScreen();
      }, 2000);
    });

    // ============================================================
    // Passaí PWA Controller & Native Install Interop
    // ============================================================
    window.passaiPwa = {
      deferredPrompt: null,
      isInstalled: false,
      canInstall: false,

      promptInstall: function() {
        if (!this.deferredPrompt) {
          return Promise.resolve(false);
        }
        var promptEvent = this.deferredPrompt;
        this.deferredPrompt = null;
        this.canInstall = false;
        this._notifyState();

        return promptEvent.prompt().then(function() {
          return promptEvent.userChoice;
        }).then(function(choice) {
          return choice && choice.outcome === 'accepted';
        }).catch(function() {
          return false;
        });
      },

      checkIsStandalone: function() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
               (window.navigator && window.navigator.standalone === true) ||
               (document.referrer && document.referrer.includes('android-app://'));
      },

      checkIsIos: function() {
        var ua = window.navigator.userAgent.toLowerCase();
        return /iphone|ipad|ipod/.test(ua);
      },

      _notifyState: function() {
        window.dispatchEvent(new CustomEvent('passai-pwa-update', {
          detail: {
            canInstall: this.canInstall,
            isInstalled: this.isInstalled,
            isStandalone: this.checkIsStandalone(),
            isIos: this.checkIsIos()
          }
        }));
      }
    };

    window.passaiPwa.isInstalled = window.passaiPwa.checkIsStandalone();

    // Captura o evento nativo beforeinstallprompt
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.passaiPwa.deferredPrompt = e;
      window.passaiPwa.canInstall = true;
      window.passaiPwa._notifyState();
    });

    // Detecta instalação concluída
    window.addEventListener('appinstalled', function() {
      window.passaiPwa.deferredPrompt = null;
      window.passaiPwa.canInstall = false;
      window.passaiPwa.isInstalled = true;
      window.passaiPwa._notifyState();
    });

    // Registra o Service Worker oficial do Passaí PWA com verificação suave em segundo plano
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js?v=1.0.8', { scope: './' })
          .then(function(reg) {
            console.log('[Passaí PWA] Service Worker ativo:', reg.scope);
            // Atrasa a checagem de update em 5s para liberar CPU total na compilação do Flutter
            setTimeout(function() {
              reg.update();
            }, 5000);
          })
          .catch(function(err) {
            console.warn('[Passaí PWA] Falha ao registrar Service Worker:', err);
          });
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=1.0.8" async></script>
</body>
