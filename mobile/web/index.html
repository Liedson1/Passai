<head>

  <meta name="keywords" content="van, vans, transporte intermunicipal, alagoas, maceió, arapiraca, palmeira dos índios, piranhas, delmiro gouveia, horários de vans">

  <!-- OpenGraph / Redes Sociais / WhatsApp -->

  <meta property="og:description" content="Consulte horários de vans intermunicipais em Alagoas em tempo real. Sem login, rápido e direto ao ponto.">

  <!-- Google Fonts: Jua (Logo), Outfit (Títulos), Manrope (Corpo) - Pré-carregamento completo -->

  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Manrope:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Preload Crítico para LCP Móvel e Inicialização Rápida -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="icons/Icon-192.png" as="image">

  <!-- CanvasKit & Skwasm CDN Preconnect (Acelera inicialização do motor WebAssembly) -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">

  <title>Passaí — Horários de Vans em Alagoas</title>
  <link rel="manifest" href="manifest.json">

  <!-- Vercel Web Analytics & Speed Insights -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

  <style>
    /* Estilo do Splash Screen Nativo com aceleração por GPU (Zero Lag) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #F9F6F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      touch-action: pan-y;
      overscroll-behavior: none;
      -webkit-overscroll-behavior: none;
    }
    #splash-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #F9F6F0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 99999;
      transform: translateZ(0);
      will-change: opacity;
      transition: opacity 0.32s cubic-bezier(0.25, 1, 0.5, 1);
      contain: strict;
    }
    .splash-logo {
      width: 68px;
      height: 68px;
      background: #D95438;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(217, 84, 56, 0.28);
      margin-bottom: 16px;
    }
    .splash-logo svg {
      width: 38px;
      height: 38px;
      fill: #FFFFFF;
    }
    .splash-title {
      font-family: 'Jua', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 28px;
      font-weight: 400;
      color: #D95438;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .splash-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #8F7D77;
      margin-bottom: 24px;
    }
    /* Barra de progresso animada 100% na GPU via transform (Nunca trava no Wasm compile) */
    .splash-bar {
      width: 140px;
      height: 4px;
      background: rgba(217, 84, 56, 0.15);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      transform: translateZ(0);
      contain: paint;
    }
    .splash-progress {
      position: absolute;
      top: 0;
      left: 0;
      width: 38%;
      height: 100%;
      background: #D95438;
      border-radius: 4px;
      will-change: transform;
      animation: pulseGpu 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes pulseGpu {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(80%);
      }
      100% {
        transform: translateX(280%);
      }
    }
  </style>
</head>
<body>
  <!-- Splash Screen visível enquanto o engine do Flutter é carregado -->
  <div id="splash-loading">
    <div class="splash-logo" style="background: none; box-shadow: none; width: 84px; height: 84px;">
      <img src="icons/Icon-192.png" alt="Passaí Logo" width="84" height="84" fetchpriority="high" loading="eager" style="width: 84px; height: 84px; border-radius: 50%; box-shadow: 0 10px 25px rgba(217, 84, 56, 0.35);">
    </div>
    <div class="splash-title">Passaí</div>
    <div class="splash-subtitle">Horários de Vans • Alagoas</div>
    <div class="splash-bar">
      <div class="splash-progress"></div>
    </div>
  </div>

  <script>
    var splashRemoved = false;
    function removeSplashScreen() {
      if (splashRemoved) return;
      splashRemoved = true;
      var splash = document.getElementById('splash-loading');
      if (splash) {
        requestAnimationFrame(function() {
          splash.style.opacity = '0';
          splash.style.pointerEvents = 'none';
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 340);
        });
      }
    }

    // Disparado pelo Flutter quando o primeiro frame renderiza
    window.addEventListener('flutter-first-frame', function () {
      removeSplashScreen();
    });

    // Fallback de segurança (caso o evento não dispare por algum motivo)
    window.addEventListener('load', function () {
      setTimeout(function () {
        removeSplashScreen();
      }, 4000);
    });

    // ============================================================
    // Passaí PWA Controller & Native Install Interop
    // ============================================================
    window.passaiPwa = {
      deferredPrompt: null,
      isInstalled: false,
      canInstall: false,

      promptInstall: function() {
        if (!this.deferredPrompt) {
          return Promise.resolve(false);
        }
        var promptEvent = this.deferredPrompt;
        this.deferredPrompt = null;
        this.canInstall = false;
        this._notifyState();

        return promptEvent.prompt().then(function() {
          return promptEvent.userChoice;
        }).then(function(choice) {
          return choice && choice.outcome === 'accepted';
        }).catch(function() {
          return false;
        });
      },

      checkIsStandalone: function() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
               (window.navigator && window.navigator.standalone === true) ||
               (document.referrer && document.referrer.includes('android-app://'));
      },

      checkIsIos: function() {
        var ua = window.navigator.userAgent.toLowerCase();
        return /iphone|ipad|ipod/.test(ua);
      },

      _notifyState: function() {
        window.dispatchEvent(new CustomEvent('passai-pwa-update', {
          detail: {
            canInstall: this.canInstall,
            isInstalled: this.isInstalled,
            isStandalone: this.checkIsStandalone(),
            isIos: this.checkIsIos()
          }
        }));
      }
    };

    window.passaiPwa.isInstalled = window.passaiPwa.checkIsStandalone();

    // Captura o evento nativo beforeinstallprompt
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.passaiPwa.deferredPrompt = e;
      window.passaiPwa.canInstall = true;
      window.passaiPwa._notifyState();
    });

    // Detecta instalação concluída
    window.addEventListener('appinstalled', function() {
      window.passaiPwa.deferredPrompt = null;
      window.passaiPwa.canInstall = false;
      window.passaiPwa.isInstalled = true;
      window.passaiPwa._notifyState();
    });

    // Registra o Service Worker oficial do Passaí PWA para habilitar prompt de instalação no Chrome/Android/Desktop
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(function(reg) {
            console.log('[Passaí PWA] Service Worker ativo:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[Passaí PWA] Falha ao registrar Service Worker:', err);
          });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
