  <script>
    var splashRemoved = false;
    window.removeSplashScreen = function() {
      if (splashRemoved) return;
      splashRemoved = true;
      var splash = document.getElementById('splash-loading');
      if (splash) {
        requestAnimationFrame(function() {
          splash.style.opacity = '0';
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 280);
        });
      }
    };

    // Remove splash assim que o primeiro frame do Flutter for desenhado
    window.addEventListener('flutter-first-frame', function () {
      window.removeSplashScreen();
    });

    // Mensagens de progresso suaves para conexões lentas ou primeiro acesso
    setTimeout(function() {
      if (!splashRemoved) {
        var statusEl = document.getElementById('splash-status');
        if (statusEl) {
          statusEl.textContent = 'Carregando linhas e horários...';
        }
      }
    }, 2800);

    setTimeout(function() {
      if (!splashRemoved) {
        var statusEl = document.getElementById('splash-status');
        if (statusEl) {
          statusEl.textContent = 'Iniciando o Passaí...';
        }
      }
    }, 5500);

    // Fallback de emergência (apenas para falhas catastróficas ou WebGL travado)
    // 20 segundos garante que conexões móveis não vejam tela em branco prematuramente
    setTimeout(function() {
      if (!splashRemoved) {
        console.warn('[Passaí] Fallback de segurança acionado.');
        window.removeSplashScreen();
      }
    }, 20000);

    // ============================================================
    // Passaí PWA Controller & Native Install Interop
    // ============================================================
    window.passaiPwa = {
      deferredPrompt: null,
      isInstalled: false,
      canInstall: false,

      promptInstall: function() {
        if (!this.deferredPrompt) {
          return Promise.resolve(false);
        }
        var promptEvent = this.deferredPrompt;
        this.deferredPrompt = null;
        this.canInstall = false;
        this._notifyState();

        return promptEvent.prompt().then(function() {
          return promptEvent.userChoice;
        }).then(function(choice) {
          return choice && choice.outcome === 'accepted';
        }).catch(function() {
          return false;
        });
      },

      checkIsStandalone: function() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
               (window.navigator && window.navigator.standalone === true) ||
               (document.referrer && document.referrer.includes('android-app://'));
      },

      checkIsIos: function() {
        var ua = window.navigator.userAgent.toLowerCase();
        return /iphone|ipad|ipod/.test(ua);
      },

      _notifyState: function() {
        window.dispatchEvent(new CustomEvent('passai-pwa-update', {
          detail: {
            canInstall: this.canInstall,
            isInstalled: this.isInstalled,
            isStandalone: this.checkIsStandalone(),
            isIos: this.checkIsIos()
          }
        }));
      }
    };

    window.passaiPwa.isInstalled = window.passaiPwa.checkIsStandalone();

    // Captura o evento nativo beforeinstallprompt
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.passaiPwa.deferredPrompt = e;
      window.passaiPwa.canInstall = true;
      window.passaiPwa._notifyState();
    });

    // Detecta instalação concluída
    window.addEventListener('appinstalled', function() {
      window.passaiPwa.deferredPrompt = null;
      window.passaiPwa.canInstall = false;
      window.passaiPwa.isInstalled = true;
      window.passaiPwa._notifyState();
    });

    // Registra o Service Worker oficial do Passaí PWA com ciclo de vida seguro
    if ('serviceWorker' in navigator) {
      // Guarda se a página já estava sendo controlada por um service worker anterior
      var hadPreviousController = Boolean(navigator.serviceWorker.controller);
      var isReloading = false;

      navigator.serviceWorker.addEventListener('controllerchange', function() {
        // Só recarrega se já havia um controlador anterior (atualização real de versão)
        // e se o aplicativo já terminou de inicializar (evita interromper a splash screen)
        if (hadPreviousController && !isReloading && splashRemoved) {
          isReloading = true;
          console.log('[Passaí PWA] Nova versão ativa. Atualizando página...');
          window.location.reload();
        }
      });

      window.addEventListener('load', function() {
        navigator.serviceWorker.register("sw.js?v=1.0.20260930111225", { scope: "./" })
          .then(function(reg) {
            console.log('[Passaí PWA] Service Worker registrado:', reg.scope);

            // Aguarda 5 segundos após a carga para verificar atualizações em background
            // Isso garante 100% de CPU e rede dedicados ao motor Flutter
            setTimeout(function() {
              reg.update();
            }, 5000);

            // Ao retornar para a aba, verifica suavemente se há nova versão
            document.addEventListener('visibilitychange', function() {
              if (document.visibilityState === 'visible') {
                reg.update();
              }
            });
          })
          .catch(function(err) {
            console.warn('[Passaí PWA] Falha no registro do Service Worker:', err);
          });
      });
    }
  </script>
